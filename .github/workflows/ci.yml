name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so newly published package advisories fail CI without a code change (ADR-0018).
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (includes NuGet vulnerability audit)
        run: dotnet restore

      - name: Check formatting and code style
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build
        timeout-minutes: 10

  # ADR-0007: scan the full git history for secrets on every push and pull request.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  # ADR-0018: the image builds, runs as non-root, serves health checks, and the compose stack starts.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --file deploy/Dockerfile --tag boilerplate-api:ci .

      - name: Image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' boilerplate-api:ci)"
          echo "Configured user: '${user}'"
          if [ -z "${user}" ] || [ "${user}" = "root" ] || [ "${user}" = "0" ]; then
            echo "The image must not run as root."
            exit 1
          fi

      - name: Smoke test the image (Production environment, no database)
        run: |
          # A syntactically valid connection string to a database that does not exist:
          # the API must start (liveness) but report not ready.
          # Authentication and e-mail settings are required to start; neither service is contacted here.
          docker run --detach --name api --publish 8080:8080 \
            --env "Database__ConnectionString=Host=127.0.0.1;Port=1;Database=none;Username=none;Password=none;Timeout=3" \
            --env "Authentication__Schemes__Bearer__Authority=https://issuer.example" \
            --env "Authentication__Schemes__Bearer__ValidAudiences__0=boilerplate-api" \
            --env "Email__Smtp__Host=smtp.invalid" \
            --env "Email__Smtp__FromAddress=noreply@boilerplate.local" \
            boilerplate-api:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/health/live
          echo
          ready="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 60 http://localhost:8080/health/ready)"
          if [ "${ready}" != "503" ]; then
            echo "Readiness must fail without a database (got ${ready})."
            exit 1
          fi
          # Not mapped in Production: anonymous callers get 401 like any unknown path, never the document.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/openapi/v1.json)"
          if [ "${status}" = "200" ]; then
            echo "OpenAPI must not be exposed outside Development (got ${status})."
            exit 1
          fi
          me="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/v1/me)"
          if [ "${me}" != "401" ]; then
            echo "API endpoints must require a token (got ${me})."
            exit 1
          fi

      - name: Show API container logs and remove it
        if: always()
        run: |
          docker logs api || true
          docker rm --force api || true

      - name: Compose stack starts and is healthy
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 16)" > deploy/.env
          docker compose --file deploy/compose.yaml up --detach --build --wait --wait-timeout 180
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/health/live
          echo
          # Ready means the API reached PostgreSQL through its configured connection string.
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/health/ready
          echo
          docker compose --file deploy/compose.yaml exec -T db pg_isready -U boilerplate -d boilerplate

      - name: Compose logs and teardown
        if: always()
        run: |
          docker compose --file deploy/compose.yaml logs || true
          docker compose --file deploy/compose.yaml down --volumes || true
