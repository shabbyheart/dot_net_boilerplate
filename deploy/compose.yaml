# Local development stack (ADR-0018). From the repository root:
#   cp deploy/.env.example deploy/.env    # then set a password
#   docker compose -f deploy/compose.yaml up -d --build
name: boilerplate

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env (see deploy/.env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent directory.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate -d boilerplate"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # GSS Encryption Mode=Disable: the chiseled image has no Kerberos library, so Npgsql's default attempt to use
      # GSS encryption logs an error on every new connection before falling back to password authentication.
      Database__ConnectionString: "Host=db;Database=boilerplate;Username=boilerplate;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      # Token issuer (ADR-0016). The placeholder lets the stack start; set AUTH_AUTHORITY to accept real tokens.
      Authentication__Schemes__Bearer__Authority: ${AUTH_AUTHORITY:-https://issuer.invalid}
      Authentication__Schemes__Bearer__ValidAudiences__0: ${AUTH_AUDIENCE:-boilerplate-api}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  db-data:
